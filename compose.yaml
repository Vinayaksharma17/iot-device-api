
services:
  postgres:
    image: postgres:16-alpine
    container_name: iot-device-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iot_devices
      POSTGRES_USER: iot_app
      POSTGRES_PASSWORD: iot_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_app -d iot_devices"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
